<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIMI - Neon AI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a001a;
        font-family: 'Inter', Arial, sans-serif;
        overflow: hidden;
      }
      #aimi-box {
        width: 100%;
        max-width: 700px;
        min-height: 550px;
        background: #0a001a;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        position: relative;
        padding: 40px 20px;
      }
      #title {
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -2px;
        color: #d8b4fe;
        text-shadow: 0 0 20px #a855f7, 0 0 40px #a855f7;
      }
      #sub {
        color: #a855f7;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 12px;
        margin-top: 8px;
      }
      #search {
        margin-top: 32px;
        width: 90%;
        max-width: 520px;
        padding: 18px 26px;
        border-radius: 999px;
        border: 1px solid #a855f7;
        outline: none;
        font-size: 16px;
        background: rgba(255,255,255,0.06);
        color: #fff;
        text-align: center;
        box-shadow: 0 0 0 1px #a855f7, 0 0 30px rgba(168,85,247,0.4);
      }
      #search::placeholder {
        color: rgba(255,255,255,0.5);
      }
      #glow {
        position: absolute;
        width: 700px;
        height: 700px;
        background: radial-gradient(circle, rgba(168,85,247,0.25) 0%, rgba(124,58,237,0.15) 30%, transparent 70%);
        pointer-events: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .hint {
        margin-top: 20px;
        color: rgba(216,180,254,0.5);
        font-size: 12px;
        letter-spacing: 1px;
      }

      .my-logo {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 100;
}
.my-logo img {
  width: auto;
  height:200px;
  object-fit: contain;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
}
    </style>
  </head>
  <body>
    <div class="my-logo">
  <a href="https://www.owenbreezy.vercel.app"><img src="Owen-breezy logo.png" alt="Owami Mzelemu logo"></a>
</div>
    <div id="aimi-box">
      <div id="glow"></div>
      <h1 id="title">A.I.M.I</h1>
      <p id="sub">neon ai interface | active</p>

      <form id="aimi-form" action="https://www.google.com/search" method="GET">
        <input id="search" name="q" type="text" placeholder="Ask AIMI anything..." autocomplete="off" autofocus />
      </form>

      <p class="hint">Press Enter to search on Google</p>
    </div>

    <script>
      const form = document.getElementById('aimi-form');
      const input = document.getElementById('search');

      form.addEventListener('submit', (e) => {
        if (input.value.trim() === '') {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
